[project]
name = "electronic_payments"
version = "15.8.3"
description = "Electronic Payments for ERPNext"
authors = [
    { name = "AgriTheory", email = "support@agritheory.dev"}
]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.urls]
homepage = "https://github.com/agritheory/electronic_payments"
repository = "https://github.com/agritheory/electronic_payments"
source = "https://github.com/agritheory/electronic_payments"
changelog = "https://github.com/agritheory/electronic_payments/CHANGELOG.md"
documentation = "https://github.com/agritheory/electronic_payments/tree/version-15/docs"
issues = "https://github.com/agritheory/electronic_payments/issues"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry.dependencies]
python = "^3.10"
authorizenet = "^1.1.5"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0,<16.0.0"
erpnext = ">=15.0.0,<16.0.0"

[tool.bench.dev-dependencies]
pytest = "~=8.2.2"
pytest-cov = "~=5.0.0"
pytest-order = "~=1.2.1"

[tool.poetry.group.dev.dependencies]
mypy = "^1.10.0"
pytest = "^8.2.2"
pytest-cov = "^5.0.0"
pytest-order = "^1.2.1"

[tool.pytest.ini_options]
addopts = "--cov=electronic_payments --cov-report term-missing"

[tool.black]
line-length = 99

[tool.isort]
line_length = 99
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
indent = "\t"

[tool.coverage.report]
skip_covered = true
skip_empty = true
omit = [
    "*/boot.py",
    "*/customize.py",
    "*/hooks.py",
    "*/install.py",
    "*/patches/*",
    "*/test_*.py",
    "*/tests/*",
]
# https://coverage.readthedocs.io/en/latest/excluding.html#advanced-exclusion
exclude_also = [
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.codespell]
skip = "CHANGELOG.md"

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = [
    "electronic_payments/__init__.py:__version__"
]
build_command = "echo 1"

[tool.semantic_release.branches.version]
match = "version-15"