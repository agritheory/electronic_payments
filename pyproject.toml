[project]
name = "electronic_payments"
description = "Electronic Payments for ERPNext"
authors = [
    { name = "AgriTheory", email = "support@agritheory.dev"}
]
readme = "README.md"
license = { file = "LICENSE" }
dynamic = ["dependencies", "version", "requires-python"]

[project.urls]
homepage = "https://github.com/agritheory/electronic_payments"
repository = "https://github.com/agritheory/electronic_payments"
source = "https://github.com/agritheory/electronic_payments"
changelog = "https://github.com/agritheory/electronic_payments/CHANGELOG.md"
documentation = "https://github.com/agritheory/electronic_payments/tree/version-15/docs"
issues = "https://github.com/agritheory/electronic_payments/issues"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
requires-poetry = ">=2.0"
version =  "15.2.0"

[tool.poetry.dependencies]
python = ">=3.10,<3.14"
authorizenet = "^1.1.5"
stripe = "^2.56.0"

[tool.poetry.group.dev.dependencies]
mypy = "^1.15.0"
pytest = "^8.3.5"
pytest-cov = "^6.0.0"
pytest-order = "^1.2.1"
test_utils = { git = "https://github.com/agritheory/test_utils.git" }

[tool.pytest.ini_options]
addopts = "--cov=electronic_payments --cov-report term-missing"

[tool.black]
line-length = 99

[tool.isort]
line_length = 99
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
indent = "\t"

[tool.coverage.report]
skip_covered = true
skip_empty = true
omit = [
    "*/boot.py",
    "*/customize.py",
    "*/hooks.py",
    "*/install.py",
    "*/patches/*",
    "*/test_*.py",
    "*/tests/*",
]
# https://coverage.readthedocs.io/en/latest/excluding.html#advanced-exclusion
exclude_also = [
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.semantic_release]
version_toml = ["pyproject.toml:tool.poetry.version"]
version_variables = [
    "electronic_payments/__init__.py:__version__"
]
build_command = "echo 1"

[tool.semantic_release.branches.version]
match = "version-15"
